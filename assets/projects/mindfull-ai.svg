<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Mindfull AI Wellness Visual</title>
  <desc id="desc">Abstract neural bloom representing conversational AI and emotional intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="60%" stop-color="#f472b6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g opacity="0.2" stroke="#f5d0fe">
    <path d="M0 130h1200M0 250h1200M0 370h1200M0 490h1200M0 610h1200"/>
  </g>
  <circle cx="600" cy="350" r="155" fill="url(#core)" filter="url(#soft)"/>
  <g stroke="#fbcfe8" stroke-width="3" fill="none" opacity="0.8">
    <path d="M600 130 L600 570"/>
    <path d="M380 350 L820 350"/>
    <path d="M470 220 L730 480"/>
    <path d="M730 220 L470 480"/>
  </g>
  <g fill="#fbcfe8">
    <circle cx="600" cy="130" r="9"/><circle cx="600" cy="570" r="9"/>
    <circle cx="380" cy="350" r="9"/><circle cx="820" cy="350" r="9"/>
    <circle cx="470" cy="220" r="9"/><circle cx="730" cy="220" r="9"/>
    <circle cx="470" cy="480" r="9"/><circle cx="730" cy="480" r="9"/>
  </g>
  <g fill="#fdf4ff" font-family="Arial, sans-serif" font-size="36" font-weight="700">
    <text x="120" y="170">MINDFULL AI</text>
    <text x="120" y="215" font-size="22" opacity="0.9">WELLNESS + RAG + SENTIMENT</text>
  </g>
</svg>
