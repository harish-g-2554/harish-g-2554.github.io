  <g fill="#fecdd3" opacity="0.95">
    <rect x="150" y="150" width="110" height="110" rx="14"/>
    <rect x="300" y="150" width="110" height="110" rx="14"/>
    <rect x="450" y="150" width="110" height="110" rx="14"/>
    <rect x="600" y="150" width="110" height="110" rx="14"/>
  </g>
  <g fill="#fff1f2" font-family="Arial, sans-serif" font-size="36" font-weight="700">
    <text x="120" y="640">DEEP LEARNING HEALTH PREDICTION</text>
    <text x="120" y="95" font-size="22" opacity="0.9">ANN + LSTM + RNN</text>
  </g>
